[package]
name = "kvbm-logical"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamo-tokens = { workspace = true }
kvbm-common = { workspace = true }
kvbm-observability = { workspace = true }

anyhow = { workspace = true }
async-stream = "0.3"
bytes = "1.10"
bincode = { version = "2.0.1", features = ["serde", "derive"] }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
lru = "0.16"
parking_lot = { workspace = true }
rmp-serde = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[features]
testing = []

[dev-dependencies]
# Test-only edge. The tier-placement wire types live in `kvbm-protocols`
# (they are built from its `CacheManifestId` / `RegistrationEpoch` identity
# types), and this transport-free crate deliberately does not depend on it at
# build time. The dev edge exists so `events::tests` can prove that a tier
# frame never mis-decodes as a legacy `KvbmCacheEvents` — a silent mis-decode
# there would be index corruption, the exact "stale success" the tier stream
# is designed to make impossible.
kvbm-protocols = { workspace = true }

criterion = "0.5"
proptest = "1.5.0"
rand = { workspace = true }
rand_chacha = "0.9"
rstest = "0.26"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# `tracing-mutex` wraps parking_lot's primitives and builds a runtime
# lock-acquisition DAG, panicking on order inversions / cycles. Used
# only under `#[cfg(test)]` because the per-acquire global-DAG cost is
# unacceptable on production hot paths.
tracing-mutex = { version = "0.3", features = ["parking_lot"] }
tracing-subscriber = { workspace = true }

# Criterion benchmark for the match_blocks / acquire hot path. Needs the
# `testing` feature for src/testing/ helpers (create_test_manager, etc.).
[[bench]]
name = "block_manager"
harness = false
required-features = ["testing"]

# Criterion benchmark for the valued leaf-eviction policy (EV-PR3): per-event
# cost, flat-with-n `next_victim`, and deep-chain eviction. Also needs the
# `testing` feature for `create_test_manager_with_backend`.
[[bench]]
name = "eviction_policy"
harness = false
required-features = ["testing"]
